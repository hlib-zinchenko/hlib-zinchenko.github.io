<!doctype html>
<!-- Social preview card for /business/. Rendered to /img/og-business.png, see _og/README.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* The dark palette from style.css, fixed so the render doesn't depend on the system theme. */
    :root { --bg: #141413; --ink: #ece9e2; --muted: #9d998f; --rule: #2e2d2a; --accent: #a993ff; color-scheme: dark; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { padding: 0 96px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { font-size: 26px; margin-bottom: 28px; }
    h1 { font-size: 96px; }
    .role { margin-top: 18px; font-size: 42px; }
    .lede { max-width: none; margin-top: 36px; font-size: 32px; color: var(--muted); }
    .rule { margin-top: 56px; padding-top: 28px; border-top: 2px solid var(--rule); font: 26px var(--mono); color: var(--muted); }
    .rule::before { content: "// "; color: var(--accent); }
  </style>
</head>
<body>
  <p class="eyebrow">Kyiv, Ukraine · Remote · Hybrid/office by arrangement</p>
  <h1>Hlib Zinchenko</h1>
  <p class="role">Senior .NET backend engineer</p>
  <p class="lede">Modular monoliths, DDD, CQRS, AI-driven development.</p>
  <p class="rule">hzinchenko.com</p>
</body>
</html>
